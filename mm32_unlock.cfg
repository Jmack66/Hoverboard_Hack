# MM32SPIN05PF flash unlock via raw memory writes.
# Uses generic Cortex-M target — bypasses stm32f1x auto-probe.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 500

# Generic Cortex-M0 — no STM32-specific driver
swd newdap mm32 cpu -enable
dap create mm32.dap -chain-position mm32.cpu
target create mm32.cpu cortex_m -endian little -dap mm32.dap

init
reset halt

# Unlock flash controller (same key sequence as STM32F1)
# FLASH_KEYR = 0x40022004
mww 0x40022004 0x45670123
mww 0x40022004 0xCDEF89AB

# Check FLASH_CR is now unlocked (bit 7 LOCK should be 0)
echo "FLASH_CR after unlock:"
mdw 0x40022010

# Mass erase: set MER (bit 2) then STRT (bit 6)
mww 0x40022010 0x00000004
mww 0x40022010 0x00000044
sleep 2000

# Check FLASH_SR — BSY (bit 0) should be 0, EOP (bit 5) set
echo "FLASH_SR after erase:"
mdw 0x4002200C

reset halt
echo "Done — flash should be blank, ready to program."
exit
