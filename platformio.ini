; Motor control firmware for GD32F130K6 hoverboard sideboards
; GD32F130K6 LQFP32 pin mapping:
;   TIMER0 high side: PA8=CH0(A), PA9=CH1(B), PA10=CH2(C)
;   TIMER0 low side:  PA7=CH0N(A), PB0=CH1N(B), PB1=CH2N(C)
;   Hall sensors:     PB3=A, PB4=B, PB5=C  <-- VERIFY after first flash
;   USART1 (ESP32):   PA2=TX, PA3=RX @ 115200

[platformio]
include_dir = Inc
src_dir     = Src

[env:K6_motor]
board           = genericGD32F130C6
platform        = https://github.com/CommunityGD32Cores/platform-gd32.git#e712045bdba54790ed2e07c47a421345340efb31
platform_packages =
    framework-spl-gd32@https://github.com/CommunityGD32Cores/gd32-pio-spl-package.git#67a6fe90b20e00b11a9a52f55d318b7d15eeed84
framework       = spl
board_build.ldscript = ./GD32F130K6_FLASH.ld
upload_protocol = custom
upload_command  = pyocd flash -t mm32spin05pf --pack /tmp/mm32_dfp_extract/1.0.8.zip $SOURCE
build_unflags   = -mcpu=cortex-m3
build_flags     =
    -IInc
    -DUSE_STDPERIPH_DRIVER
    -g -ggdb
    -mcpu=cortex-m0
    -mthumb
monitor_speed   = 115200
